
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription des étudiants | ESEF</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #172d50;
}

header {
  background: white;
  padding: 22px 15px;
  text-align: center;
  border-bottom: 4px solid #173c82;
}

.logo {
  width: 100%;
  max-width: 570px;
  height: auto;
  object-fit: contain;
  display: block;
  margin: auto;
}

.header-text {
  margin-top: 15px;
}

.header-text h1 {
  font-size: 21px;
  margin: 8px 0;
  color: #173c82;
}

.header-text p {
  color: #64748b;
  margin: 5px 0;
  font-size: 14px;
}

.container {
  max-width: 520px;
  margin: 35px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 28px 23px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

.card h2 {
  text-align: center;
  color: #173c82;
  margin-top: 0;
  font-size: 23px;
}

.description {
  text-align: center;
  color: #64748b;
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 20px 0 9px;
  font-weight: bold;
  font-size: 15px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d5deeb;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #173c82;
  box-shadow: 0 0 0 3px rgba(23,60,130,.08);
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 27px;
  border: none;
  border-radius: 8px;
  background: #173c82;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #102e68;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#message {
  text-align: center;
  margin-top: 17px;
  font-size: 14px;
  line-height: 1.7;
}

footer {
  text-align: center;
  padding: 22px 12px;
  color: #64748b;
  font-size: 12px;
}

</style>
</head>

<body>

<header>

<img src="logo.png"
     alt="Logo de l'établissement"
     class="logo">

<div class="header-text">
<h1>École Supérieure de l'Éducation et de la Formation</h1>
<p>Formulaire officiel d'inscription des étudiants</p>
</div>

</header>

<main class="container">

<div class="card">

<h2>Inscription</h2>

<p class="description">
Veuillez remplir le formulaire ci-dessous
en renseignant vos informations personnelles.
</p>

<form id="registrationForm">

<label for="fullname">Nom et prénom</label>

<input
  type="text"
  id="fullname"
  placeholder="Saisissez votre nom et prénom"
  required
  minlength="3"
>

<label for="phone">Numéro de téléphone</label>

<input
  type="tel"
  id="phone"
  placeholder="Exemple : 06XXXXXXXX"
  required
  maxlength="20"
>

<button type="submit" id="submitBtn">
Envoyer mon inscription
</button>

</form>

<div id="message" role="status"></div>

</div>
</main>

<footer>
© École Supérieure de l'Éducation et de la Formation
</footer>

<script>
const form = document.getElementById("registrationForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("fullname").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if (name.length < 3 || phone.length < 8) {
    message.textContent = "Veuillez vérifier vos informations.";
    message.style.color = "red";
    return;
  }

  message.textContent =
    "Le formulaire est prêt. Veuillez patienter pour l'activation du service.";

  message.style.color = "#173c82";
});
</script>

</body>
</html>
